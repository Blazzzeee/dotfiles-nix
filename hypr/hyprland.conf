################
### MONITORS ###
################

monitor=eDP-1,1920x1200,0x0,1
monitor=HDMI-A-1,1920x1080,auto-up,1
# Set programs that you use
### AUTOSTART ###

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = waybar &
exec-once = swww-daemon --format xrgb     
exec-once = swaync &
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_THEME,Vimix-cursors
env = XCURSOR_SIZE,32
env = XDG_SESSION_TYPE,wayland

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 4
    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors

    col.active_border = rgb(b4befe) rgb(f5c2e7) 45deg

    col.inactive_border = rgb(585b70)     
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

misc {
    focus_on_activate=false
    disable_splash_rendering = true
    disable_hyprland_logo = true
}
# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0xee1a1a1a 
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 1
        passes = 3
        popups = false
        vibrancy = 0.85
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
source = ./animation.conf 

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
    mfact=0.60
}


# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = true
# }
gesture = 3 , horizontal , workspace

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$brightness = ~/.config/scripts/brightness.sh
$volume = ~/.config/scripts/volume.sh
$browser = qutebrowser
$terminal = kitty
$fileManager = $terminal yazi 

# $menu =  rofi -show drun -no-history -matching fuzzy -drun-match-fields name -no-tokenize
# $menu= tofi-drun --config ~/.config/tofi/config.toml --font /usr/share/fontJetBrainsMono-Regular.ttf --hint-font false --ascii-input true --late-keyboard-init 
 $menu = rofi -show drun
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod,return,exec,$terminal
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, R , exec , ~/.config/scripts/zellij.sh
bind = $mainMod, T , exec , pkill waybar ; waybar &
bind = $mainMod, B, exec, $browser
# bind = $mainMod, B, exec, Brave
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT , Q , exit,
bind = $mainMod, E, togglefloating,
bind = $mainMod, X, exec , ~/.config/rofi/powermenu/powermenu.sh 
bind = $mainMod, P, pseudo, 
bind = $mainMod, SPACE, togglesplit, # dwindle
bind = $mainMod, Z , fullscreen
bind = $mainMod , O , exec, $menu
# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

#move windows 
 
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, j, movewindow, u
bind = SUPER SHIFT, k, movewindow, d 

#resize active window

bind = SUPER CTRL, h, resizeactive, -20 0
bind = SUPER CTRL, l, resizeactive, 20 0
bind = SUPER CTRL, j, resizeactive, 0 -20
bind = SUPER CTRL, k, resizeactive, 0 20


# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $volume inc 
bindel = ,XF86AudioLowerVolume, exec, $volume dec 
bindel = ,XF86AudioMute, exec, $volume toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, $brightness inc 
bindel = ,XF86MonBrightnessDown, exec,$brightness dec

bind = ,Print, exec, grim ~/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot Captured" "Saved to ~/Pictures"
bind = ,Shift+Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot_area_$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot Captured" "Area screenshot saved to ~/Pictures"

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*
# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


#windowrulev2 = float ,class:^(kitty)$,title:^(kitty)$
windowrulev2 = float, class:^(org\.stronnag\.wayfarer)$, title:^(Wayfarer)$
windowrulev2 = size 533 215, class:^(org\.stronnag\.wayfarer)$, title:^(Wayfarer)$
layerrule = blur ,logout_dialog 
layerrule = blur ,waybar 
# layerrule = blur, swaync-control-center
# layerrule = blur, swaync-notification-window
# layerrule = ignorezero, swaync-control-center
# layerrule = ignorezero, swaync-notification-window
# layerrule = ignorealpha 0.5, swaync-control-center
# layerrule = ignorealpha 0.5, swaync-notification-window

windowrulev2 = workspace 1, class:^(kitty)$

# Min Browser: workspace 2
windowrulev2 = workspace 2, class:^(Brave)$


windowrulev2 = workspace 5, class:^(Spotify)$


animations {
    enabled = true
    # Animation curves
    
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1 # use with .2s duration
    # Animation configs
    animation = windows, 1, 1.5, md3_decel, popin 60%
    animation = windowsIn, 1, 1.5, md3_decel, popin 60%
    animation = windowsOut, 1, 1.5, md3_accel, popin 60%
    animation = border, 1, 5, default
    animation = fade, 1, 1.5, md3_decel
    # animation = layers, 1, 2, md3_decel, slide
    animation = layersIn, 1, 1.5, menu_decel, slide
    animation = layersOut, 1, 1.5, menu_accel
    animation = fadeLayersIn, 1, 1.5, menu_decel
    animation = fadeLayersOut, 1, 2.0, menu_accel
    animation = workspaces, 1, 3.5, menu_decel, slide
    # animation = workspaces, 1, 2.5, softAcDecel, slide
    # animation = workspaces, 1, 7, menu_decel, slidefade 15%
    # animation = specialWorkspace, 1, 3, md3_decel, slidefadevert 15%
    animation = specialWorkspace, 1, 2, md3_decel, slidevert
}
